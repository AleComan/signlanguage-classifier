experiment_name: scratch_cnn
seed: 42
device: cpu

data:
  root_dir: data/asl_alphabet_v1/processed
  train_subdir: train
  val_subdir: val
  image_size: 128
  batch_size: 32
  num_workers: 0

training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0

model:
  num_classes: null  # resolved dynamically from dataset
  channels: [16, 32, 64]
  dropout: 0.2

tracking:
  use_wandb: true
  project: image-classification
  run_name: scratch-cnn
  tags: ["scratch", "cnn"]

hparam_search:
  enabled: true
  strategy: random   # grid | random
  seed: 22
  n_trials: 4
  max_trials: 12
  param_grid:
    learning_rate: [0.001, 0.0005, 0.0001]
    weight_decay: [0.0, 0.0001]
    dropout: [0.2, 0.3, 0.5]
    channels:
      - [16, 32, 64]
      - [32, 64, 128]
    batch_size: [32, 64]
    epochs: 8

output:
  artifacts_dir: artifacts
  checkpoint_name: scratch_cnn.pt
